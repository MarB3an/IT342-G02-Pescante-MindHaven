spring:
  datasource:
    url: jdbc:h2:mem:mindhaven_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: mindhaven
        hbm2ddl:
          create_namespaces: true

mindhaven:
  security:
    jwt-secret: test-jwt-secret-key-for-mindhaven-integration-tests-2026
    email-hash-pepper: test-email-pepper-for-mindhaven-integration-tests-2026
    cookie-secure: false
    allowed-email-domains: cit.edu,edu,edu.ph
  bootstrap:
    admin-email: admin@cit.edu
    admin-password: AdminPassword1!
    admin-full-name: Test System Admin
